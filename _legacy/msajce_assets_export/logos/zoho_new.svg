<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
    <!-- Red Square -->
    <rect x="40" y="60" width="100" height="100" rx="20" fill="white" stroke="#de332a" stroke-width="18" transform="rotate(-15 90 110)" />
    <!-- Blue Square -->
    <rect x="230" y="60" width="100" height="100" rx="20" fill="white" stroke="#2672b8" stroke-width="18" transform="rotate(-10 280 110)" />
    <!-- Green Square (Overlaps Red and Blue) -->
    <rect x="135" y="35" width="100" height="100" rx="20" fill="white" stroke="#16a055" stroke-width="18" transform="rotate(20 185 85)" />
    <!-- Yellow Square (Overlaps Blue) -->
    <rect x="330" y="55" width="100" height="100" rx="20" fill="white" stroke="#f9b418" stroke-width="18" />
    
    <!-- Text -->
    <text x="250" y="220" font-family="Arial, sans-serif" font-weight="900" font-size="65" fill="#000" text-anchor="middle" letter-spacing="35">ZOHO</text>
</svg>